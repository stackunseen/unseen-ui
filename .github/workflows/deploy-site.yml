name: Deploy site
# Builds the static Unseen UI site with the production origin and publishes apps/docs/out
# to Cloudflare Pages. Package publishing stays in release.yml.
on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
# A newer push replaces a deployment still in progress.
concurrency:
  group: deploy-site
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Optional repository variables: SITE_ORIGIN (overrides the production origin) and
    # CLOUDFLARE_PAGES_PROJECT (defaults to unseenui). Required secrets: CLOUDFLARE_API_TOKEN
    # (Cloudflare Pages edit permission) and CLOUDFLARE_ACCOUNT_ID.
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://unseenui.com' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Require the production origin
        run: |
          case "$SITE_ORIGIN" in
            https://*) ;;
            *) echo "SITE_ORIGIN must be the exact https origin, for example https://unseenui.com" >&2; exit 1 ;;
          esac
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @ai-interaction/docs build
      - name: Check the configured export
        run: node apps/docs/scripts/check-static-site.mjs
      - name: Publish to Cloudflare Pages
        # Wrangler must run inside the app directory, not the workspace root, and pnpm dlx
        # resolves relative paths from the workspace root, so the export path is absolute.
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm dlx wrangler@4 pages deploy "$GITHUB_WORKSPACE/apps/docs/out"
          --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT || 'unseenui' }}"
          --branch main
          --commit-hash "${{ github.sha }}"
          --commit-dirty=false
