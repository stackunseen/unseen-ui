name: Verify
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Pull requests need the base branch so Vitest can select the affected test files.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm build:packages
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Pull requests run only the test files affected by the changed modules; main runs everything.
      - name: Affected unit tests
        if: github.event_name == 'pull_request'
        run: pnpm vitest run --changed origin/${{ github.base_ref }}
      - name: Unit tests
        if: github.event_name != 'pull_request'
        run: pnpm test
      # Pull requests run the fast checks; main and manual runs add the slow ones.
      - name: Restore Next.js build cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/docs/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/docs/**/*.{ts,tsx,mdx,css}', 'packages/*/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
        if: github.event_name != 'pull_request'
      - name: Restore smoke browser
        if: github.event_name != 'pull_request'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install smoke browser
        if: github.event_name != 'pull_request'
        run: pnpm exec playwright-cli install-browser chromium --with-deps
        timeout-minutes: 5
      - name: Browser accessibility and recovery smoke
        if: github.event_name != 'pull_request'
        run: pnpm test:browser
        timeout-minutes: 4
      - name: Retain browser smoke evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-smoke
          path: output/playwright/ci-smoke/
          if-no-files-found: ignore
          retention-days: 7
      # The exported site: routes, links and SEO, then real journeys and axe in a browser.
      - name: Docs site checks
        if: github.event_name != 'pull_request'
        run: |
          node apps/docs/scripts/check-static-site.mjs
          mkdir -p output
          node apps/docs/scripts/preview.mjs > output/docs-preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:4175/ > /dev/null && break; sleep 1; done
          node apps/docs/scripts/site-browser-check.mjs
        timeout-minutes: 10
      - name: Retain site check evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-check
          path: output/playwright/unseen-site/
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm check:packages
        if: github.event_name != 'pull_request'
      - run: pnpm check:size
      - run: pnpm build:storybook
        if: github.event_name != 'pull_request'
